<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uiverse Card | new-donkey-55</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      background: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, sans-serif;
    }

    /* ========== Card Component ========== */
    .card {
      --card-bg: #ffffff;
      --card-accent: #64748b;
      --card-accent-light: rgba(100, 116, 139, 0.25);
      --card-accent-border: rgba(100, 116, 139, 0.2);
      --card-text: #1e293b;
      --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      --card-badge-bg: #94a3b8;
      --card-image-gradient: linear-gradient(45deg, #94a3b8, #64748b);
      --card-button-glow: rgba(100, 116, 139, 0.2);
      --card-pattern-color: rgba(148, 163, 184, 0.1);

      width: 190px;
      height: 280px;
      background: var(--card-bg);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, sans-serif;
    }

    /* Default card (neutral slate theme) */
    .card--default {
      --card-accent: #64748b;
      --card-accent-light: rgba(100, 116, 139, 0.25);
      --card-accent-border: rgba(100, 116, 139, 0.2);
      --card-badge-bg: #94a3b8;
      --card-image-gradient: linear-gradient(45deg, #94a3b8, #64748b);
      --card-button-glow: rgba(100, 116, 139, 0.2);
      --card-pattern-color: rgba(148, 163, 184, 0.1);
    }

    /* New card (purple theme, default) */
    .card--new {
      --card-accent: #7c3aed;
      --card-accent-light: rgba(124, 58, 237, 0.3);
      --card-accent-border: rgba(124, 58, 237, 0.2);
      --card-badge-bg: #10b981;
      --card-image-gradient: linear-gradient(45deg, #a78bfa, #8b5cf6);
      --card-button-glow: rgba(124, 58, 237, 0.2);
      --card-pattern-color: rgba(139, 92, 246, 0.1);
    }

    /* Hot card (amber/orange theme) */
    .card--hot {
      --card-accent: #f59e0b;
      --card-accent-light: rgba(245, 158, 11, 0.3);
      --card-accent-border: rgba(245, 158, 11, 0.25);
      --card-badge-bg: #ef4444;
      --card-image-gradient: linear-gradient(45deg, #fbbf24, #f59e0b);
      --card-button-glow: rgba(245, 158, 11, 0.25);
      --card-pattern-color: rgba(251, 191, 36, 0.15);
    }

    .card__shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0.8) 50%,
        rgba(255, 255, 255, 0) 60%
      );
      background-size: 200% 100%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card__glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(
        circle at 50% 0%,
        var(--card-accent-light) 0%,
        transparent 70%
      );
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .card__content {
      padding: 1.25em;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75em;
      position: relative;
      z-index: 2;
    }

    .card__badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--card-badge-bg);
      color: white;
      padding: 0.25em 0.5em;
      border-radius: 999px;
      font-size: 0.7em;
      font-weight: 600;
      transform: scale(0.8);
      opacity: 0;
      transition: all 0.4s ease 0.1s;
    }

    .card__image {
      width: 100%;
      height: 100px;
      background: var(--card-image-gradient);
      border-radius: 12px;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .card__image::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at 30% 30%,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 30%
        ),
        repeating-linear-gradient(
          45deg,
          var(--card-pattern-color) 0px,
          var(--card-pattern-color) 2px,
          transparent 2px,
          transparent 4px
        );
      opacity: 0.5;
    }

    .card__text {
      display: flex;
      flex-direction: column;
      gap: 0.25em;
    }

    .card__title {
      color: var(--card-text);
      font-size: 1.1em;
      margin: 0;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .card__description {
      color: var(--card-text);
      font-size: 0.75em;
      margin: 0;
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    .card__stats {
      display: flex;
      align-items: center;
      gap: 0.75em;
    }

    .card__stat {
      display: flex;
      align-items: center;
      gap: 0.25em;
      color: var(--card-text);
      font-size: 0.7em;
      opacity: 0.55;
      transition: all 0.3s ease;
    }

    .card__stat svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .card__avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7em;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      transition: all 0.4s ease;
      position: relative;
    }

    .card__avatar--purple {
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
    }

    .card__avatar--blue {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
    }

    .card__avatar--slate {
      background: linear-gradient(135deg, #94a3b8, #64748b);
    }

    .card__footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .card__footer-left {
      display: flex;
      align-items: center;
      gap: 0.5em;
    }

    .card__price {
      color: var(--card-text);
      font-weight: 700;
      font-size: 1em;
      transition: all 0.3s ease;
    }

    .card__button {
      width: 28px;
      height: 28px;
      background: var(--card-accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      transform: scale(0.9);
    }

    /* ========== Hover Effects ========== */
    .card:hover {
      transform: translateY(-10px);
      box-shadow:
        0 20px 25px -5px rgba(0, 0, 0, 0.1),
        0 10px 10px -5px rgba(0, 0, 0, 0.04);
      border-color: var(--card-accent-border);
    }

    .card:hover .card__shine {
      opacity: 1;
      animation: shine 3s infinite;
    }

    .card:hover .card__glow {
      opacity: 1;
    }

    .card:hover .card__badge {
      transform: scale(1);
      opacity: 1;
      z-index: 1;
    }

    .card:hover .card__image {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .card:hover .card__title {
      color: var(--card-accent);
      transform: translateX(2px);
    }

    .card:hover .card__description {
      opacity: 1;
      transform: translateX(2px);
    }

    .card:hover .card__stat {
      opacity: 0.8;
      transform: translateX(2px);
    }

    .card:hover .card__stat--favorite {
      color: #ef4444;
    }

    .card:hover .card__price {
      color: var(--card-accent);
      transform: translateX(2px);
    }

    .card:hover .card__avatar {
      transform: scale(1.15);
    }

    .card:hover .card__avatar--purple {
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.3);
    }

    .card:hover .card__avatar--blue {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }

    .card:hover .card__avatar--slate {
      box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.3);
    }

    .card:hover .card__button {
      transform: scale(1);
      box-shadow: 0 0 0 4px var(--card-button-glow);
    }

    .card:hover .card__button svg {
      animation: pulse 1.5s infinite;
    }

    /* ========== Active State ========== */
    .card:active {
      transform: translateY(-5px) scale(0.98);
    }

    /* ========== Animations ========== */
    @keyframes shine {
      0% {
        background-position: -100% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <!-- Card 1: New -->
  <div class="card card--new">
    <div class="card__shine"></div>

    <div class="card__content">
      <span class="card__badge">New</span>

      <div class="card__text">

      </div>
      <div class="card__stats">
        <span class="card__stat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="card card--hot">

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>

      </div>
    </div>
  </div>

  <!-- Card 3: Default -->
  <div class="card card--default">
    <div class="card__shine"></div>
    <div class="card__glow"></div>
    <div class="card__content">
      <div class="card__image"></div>
