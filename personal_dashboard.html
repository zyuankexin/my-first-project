<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人高效工作台 (Personal Dashboard)</title>
    <style>
        /* ==========================================================================
           1. 基础变量与全局样式 (CSS Variables & Global Styles)
           ========================================================================== */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --accent-color: #3498db;
            --accent-hover: #2980b9;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --border-radius: 12px;
            --shadow: 0 8px 24px rgba(149, 157, 165, 0.15);
            --transition: all 0.3s ease;
        }

        /* 暗黑模式变量 */
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-primary: #ecf0f1;
            --text-secondary: #bdc3c7;
            --accent-color: #3498db;
            --accent-hover: #5dade2;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: var(--transition);
            line-height: 1.6;
            padding: 20px;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ==========================================================================
           2. 头部区域 (Header Styles)
           ========================================================================== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo-area p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-toggle-btn {
            background: none;
            border: 2px solid var(--text-secondary);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .theme-toggle-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* ==========================================================================
           3. 栅格布局主体 (Grid Layout Main)
           ========================================================================== */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg-color);
            color: var(--text-primary);
        }

        /* ==========================================================================
           4. 组件一：时钟与天气 (Clock & Quick Info)
           ========================================================================== */
        .clock-display {
            font-size: 48px;
            font-weight: 700;
            text-align: center;
            margin: 10px 0;
            color: var(--accent-color);
            font-variant-numeric: tabular-nums;
        }

        .date-display {
            text-align: center;
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .motto-area {
            text-align: center;
            font-style: italic;
            color: var(--text-secondary);
            padding: 10px;
            background: var(--bg-color);
            border-radius: 8px;
        }

        /* ==========================================================================
           5. 组件二：待办事项 (Todo List)
           ========================================================================== */
        .todo-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .todo-input-group input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--text-secondary);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text-primary);
            outline: none;
        }

        .todo-input-group input:focus {
            border-color: var(--accent-color);
        }

        .btn-add {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-add:hover {
            background: var(--accent-hover);
        }

        .todo-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--bg-color);
            margin-bottom: 8px;
            border-radius: 6px;
            transition: var(--transition);
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .todo-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 14px;
        }

        /* ==========================================================================
           6. 组件三：番茄钟 (Pomodoro Timer)
           ========================================================================== */
        .timer-display {
            font-size: 56px;
            text-align: center;
            font-weight: 700;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .btn-timer {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-start { background: var(--success-color); color: white; }
        .btn-pause { background: var(--accent-color); color: white; }
        .btn-reset { background: var(--danger-color); color: white; }

        .timer-status {
            text-align: center;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* 响应式微调 */
        @media (max-width: 600px) {
            body { padding: 10px; }
            header { flex-direction: column; gap: 15px; text-align: center; }
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 头部区域 -->
        <header>
            <div class="logo-area">
                <h1>我的高效工作台</h1>
                <p>自律、专注、持续成长</p>
            </div>
            <div class="controls">
                <button class="theme-toggle-btn" id="themeToggle">切换主题</button>
            </div>
        </header>

        <!-- 主体部件网格 -->
        <main class="main-grid">
            
            <!-- 组件 1：动态时钟卡片 -->
            <section class="card">
                <div class="card-title">时间与动态</div>
                <div class="clock-display" id="clock">00:00:00</div>
                <div class="date-display" id="date">2026年01px01日 星期一</div>
                <div class="motto-area" id="motto">加载中...</div>
            </section>

            <!-- 组件 2：番茄专注卡片 -->
            <section class="card">
                <div class="card-title">番茄专注钟</div>
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="timer-controls">
                    <button class="btn-timer btn-start" id="startTimer">开始</button>
                    <button class="btn-timer btn-pause" id="pauseTimer">暂停</button>
                    <button class="btn-timer btn-reset" id="resetTimer">重置</button>
                </div>
                <div class="timer-status" id="timerStatus">准备专注</div>
            </section>

            <!-- 组件 3：待办清单卡片 -->
            <section class="card">
                <div class="card-title">今日核心任务</div>
                <div class="todo-input-group">
                    <input type="text" id="todoInput" placeholder="添加一个新的待办事项...">
                    <button class="btn-add" id="addTodoBtn">添加</button>
                </div>
                <ul class="todo-list" id="todoList">
                    <!-- 动态生成 -->
                </ul>
            </section>

        </main>
    </div>

    <!-- ==========================================================================
       7. 核心业务逻辑 (JavaScript Features)
       ========================================================================== */ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // ------ 7.1 主题切换功能 (Theme Switch) ------
            const themeToggle = document.getElementById('themeToggle');
            // 初始化检查本地缓存
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeToggle.textContent = savedTheme === 'dark' ? '☀️ 浅色模式' : '🌙 深色模式';

            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeToggle.textContent = newTheme === 'dark' ? '☀️ 浅色模式' : '🌙 深色模式';
            });

            // ------ 7.2 动态数字时钟 (Live Clock) ------
            function updateClock() {
                const now = new Date();
                
                // 格式化时间
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

                // 格式化日期
                const year = now.getFullYear();
                const month = now.getMonth() + 1;
                const date = now.getDate();
                const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const day = days[now.getDay()];
                document.getElementById('date').textContent = `${year}年${month}月${date}日 ${day}`;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // 每日金句本地兜底库
            const mottos = [
                "种一棵树最好的时间是十年前，其次是现在。",
                "不积跬步，无以至千里；不积小流，无以成江海。",
                "成功不是将来才有的，而是从决定去做的那一刻起，持续累积而成。",
                "专注当前的这一刻，就是对未来最好的投资。"
            ];
            document.getElementById('motto').textContent = mottos[Math.floor(Math.random() * mottos.length)];


            // ------ 7.3 待办事项逻辑 (Todo List with LocalStorage) ------
            const todoInput = document.getElementById('todoInput');
            const addTodoBtn = document.getElementById('addTodoBtn');
            const todoList = document.getElementById('todoList');
            
            let todos = JSON.parse(localStorage.getItem('dashboard-todos')) || [
                { id: 1, text: '完成前端项目搭建 🚀', completed: true },
                { id: 2, text: '体验一轮番茄钟专注 ⏱️', completed: false }
            ];

            function saveTodos() {
                localStorage.setItem('dashboard-todos', JSON.stringify(todos));
            }

            function renderTodos() {
                todoList.innerHTML = '';
                todos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                    
                    li.innerHTML = `
                        <div class="todo-item-left">
                            <input type="checkbox" ${todo.completed ? 'checked' : ''} data-id="${todo.id}">
                            <span class="todo-text">${todo.text}</span>
                        </div>
                        <button class="btn-delete" data-id="${todo.id}">删除</button>
                    `;
                    todoList.appendChild(li);
                });
            }

            // 添加待办
            function addTodo() {
                const text = todoInput.value.trim();
                if (!text) return;
                
                const newTodo = {
                    id: Date.now(),
                    text: text,
                    completed: false
                };
                todos.push(newTodo);
                saveTodos();
                renderTodos();
                todoInput.value = '';
            }

            addTodoBtn.addEventListener('click', addTodo);
            todoInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTodo();
            });

            // 事件委托处理点击状态与删除
            todoList.addEventListener('click', (e) => {
                const id = parseInt(e.target.dataset.id);
                if (!id) return;

                if (e.target.type === 'checkbox') {
                    todos = todos.map(todo => todo.id === id ? { ...todo, completed: e.target.checked } : todo);
                } else if (e.target.classList.contains('btn-delete')) {
                    todos = todos.filter(todo => todo.id !== id);
                }
                
                saveTodos();
                renderTodos();
            });

            renderTodos();


            // ------ 7.4 番茄钟业务逻辑 (Pomodoro Timer) ------
            let timer;
            let timeLeft = 25 * 60; // 默认25分钟转换为秒
            let isRunning = false;
            let isWorkMode = true; // true: 专注期, false: 休息期

            const timerDisplay = document.getElementById('timerDisplay');
            const startTimerBtn = document.getElementById('startTimer');
            const pauseTimerBtn = document.getElementById('pauseTimer');
            const resetTimerBtn = document.getElementById('resetTimer');
            const timerStatus = document.getElementById('timerStatus');

            function updateTimerDisplay() {
                const minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                const seconds = String(timeLeft % 60).padStart(2, '0');
                timerDisplay.textContent = `${minutes}:${seconds}`;
            }

            function startTimer() {
                if (isRunning) return;
                isRunning = true;
                timerStatus.textContent = isWorkMode ? "🎯 正在深度专注中..." : "☕ 放松休息一下吧...";
                
                timer = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timer);
                        isRunning = false;
                        // 振动或提示（在浏览器支持的情况下）
                        if (navigator.vibrate) navigator.vibrate(200);
                        
                        alert(isWorkMode ? "太棒了！你完成了一次番茄专注，去休息一会儿吧！" : "休息结束，准备开始下一轮专注！");
                        
                        // 状态轮转
                        isWorkMode = !isWorkMode;
                        timeLeft = isWorkMode ? 25 * 60 : 5 * 60;
                        timerStatus.textContent = isWorkMode ? "准备专注" : "准备休息";
                        updateTimerDisplay();
                    }
                }, 1000);
            }

            function pauseTimer() {
                clearInterval(timer);
                isRunning = false;
                timerStatus.textContent = "⏸️ 专注已暂停";
            }

            function resetTimer() {
                clearInterval(timer);
                isRunning = false;
                isWorkMode = true;
                timeLeft = 25 * 60;
                timerStatus.textContent = "准备专注";
                updateTimerDisplay();
            }

            startTimerBtn.addEventListener('click', startTimer);
            pauseTimerBtn.addEventListener('click', pauseTimer);
            resetTimerBtn.addEventListener('click', resetTimer);

            updateTimerDisplay();
        });
    </script>
</body>
</html>
